# .streamlit/config.toml

# This file is used to configure your Streamlit app environment.

# NOTE: The [global] and [client] sections are often problematic on Streamlit Cloud.
# We are moving the critical Python version setting to [runner].

# [client] is generally not needed for deployment, we will remove it.
# showWarningOnDirectExecution = true

[server]

# Set the port the server listens on
port = 8501

[logger]

# The level of logging. Valid options are "info", "warning", "error", "debug".
level = "info"

[browser]

# Whether to open the browser automatically when the script is run.
gatherUsageStats = false

[runner]
# CRITICAL: This line pins the Python version for Streamlit Cloud deployment.
# It MUST be under [runner] for modern Streamlit versions (like 1.50.0).
pythonVersion = "3.10"
